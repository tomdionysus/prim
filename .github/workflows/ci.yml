name: ci

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build jq
      - name: Sanitizers
        run: |
          cmake -S . -B build/san -G Ninja -DPRIM_SANITIZE=ON
          cmake --build build/san
          ./build/san/prim_tests
          ./build/san/prim_example
          for seed in 1 2 3 4 5 6 7; do PRIM_SEED=$seed ./build/san/prim_tests > /dev/null; done
      - name: Every optimisation level, warnings as errors
        run: |
          for type in Debug Release MinSizeRel RelWithDebInfo; do
            cmake -S . -B build/$type -G Ninja -DCMAKE_BUILD_TYPE=$type
            cmake --build build/$type
            ./build/$type/prim_tests > /dev/null
          done
      - name: Arena alignments
        run: |
          for align in 16 32 64; do
            cmake -S . -B build/align$align -G Ninja -DCMAKE_CXX_FLAGS=-DPRIM_ARENA_ALIGN=${align}u
            cmake --build build/align$align
            ./build/align$align/prim_tests > /dev/null
          done
      - name: A simulated day
        run: |
          ./build/Release/prim_soak v3
          ./build/Release/prim_soak v4
      - name: Coverage, every line and branch
        run: ./coverage.sh

  boards:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.2
    strategy:
      matrix:
        board: [heltec_v3, heltec_v4, tdeck]
    steps:
      - uses: actions/checkout@v4
      - name: Build the test app
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd target
          idf.py @${{ matrix.board }}.args build

  qemu:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: The suite on an ESP32-S3 under QEMU
        shell: bash
        run: |
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
          ./target/run.sh heltec_v3
